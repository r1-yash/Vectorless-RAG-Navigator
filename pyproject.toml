[project]
name = "vectorless-rag-navigator"
version = "0.1.0"
description = "Vectorless RAG Lecture Navigator using hierarchical topic-tree LLM reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "youtube-transcript-api>=0.6.2",
    "pydantic>=2.6.0",
    "groq>=0.5.0",
    "openai>=1.14.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
